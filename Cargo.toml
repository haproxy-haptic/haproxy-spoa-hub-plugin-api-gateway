[package]
name = "api-gateway-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Low-latency API gateway validation plugin for haproxy-spoa-hub"
license = "Apache-2.0"
repository = "https://gitlab.com/haproxy-haptic/haproxy-spoa-hub-plugin-api-gateway"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
haproxy-spoa-hub-plugin-api = "0.7"
jsonschema = { version = "0.48", default-features = false }
log = "0.4"
serde_json = "1"
